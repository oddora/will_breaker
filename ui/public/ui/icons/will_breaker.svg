<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg256" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="100%" stop-color="#1a1a3a"/>
    </linearGradient>
    <linearGradient id="ring1_256" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f8ef7"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="ring2_256" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#4f8ef7"/>
    </linearGradient>
    <linearGradient id="ring3_256" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow256">
      <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="256" height="256" rx="48" fill="url(#bg256)"/>
  
  <!-- Outer ring -->
  <circle cx="128" cy="128" r="104" fill="none" stroke="url(#ring1_256)" stroke-width="5" opacity="0.6" filter="url(#glow256)"/>
  
  <!-- Middle ring -->
  <circle cx="128" cy="128" r="80" fill="none" stroke="url(#ring2_256)" stroke-width="4" opacity="0.8"/>
  
  <!-- Inner ring -->
  <circle cx="128" cy="128" r="56" fill="none" stroke="url(#ring3_256)" stroke-width="3" opacity="0.9"/>
  
  <!-- Center dot -->
  <circle cx="128" cy="128" r="16" fill="#4f8ef7" filter="url(#glow256)"/>
  
  <!-- Energy lines -->
  <path d="M 128 24 L 128 56" stroke="#4f8ef7" stroke-width="4" opacity="0.7"/>
  <path d="M 128 200 L 128 232" stroke="#4f8ef7" stroke-width="4" opacity="0.7"/>
  <path d="M 24 128 L 56 128" stroke="#a78bfa" stroke-width="4" opacity="0.7"/>
  <path d="M 200 128 L 232 128" stroke="#a78bfa" stroke-width="4" opacity="0.7"/>
  
  <!-- Diagonal energy lines -->
  <path d="M 56 56 L 80 80" stroke="#4ade80" stroke-width="3" opacity="0.5"/>
  <path d="M 200 200 L 176 176" stroke="#4ade80" stroke-width="3" opacity="0.5"/>
  <path d="M 200 56 L 176 80" stroke="#f59e0b" stroke-width="3" opacity="0.5"/>
  <path d="M 56 200 L 80 176" stroke="#f59e0b" stroke-width="3" opacity="0.5"/>
  
  <!-- Text label -->
  <text x="128" y="248" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#888" text-anchor="middle" font-weight="500">WILL BREAKER</text>
</svg>
